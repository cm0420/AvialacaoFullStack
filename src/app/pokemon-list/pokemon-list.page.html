<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Pokémons</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleSearch()">
        <ion-icon slot="icon-only" name="search"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  @if (showSearch()) {
    <ion-toolbar>
      <ion-searchbar
        placeholder="Buscar por nome"
        debounce="0"
        (ionInput)="onSearchInput($event)"
      ></ion-searchbar>
    </ion-toolbar>
  }
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      @for (pokemon of displayedPokemons(); track pokemon.id) {
        <ion-col size="6" size-md="4" size-lg="3">
          <ion-card class="pokemon-card">
            <button
              class="favorite-button"
              (click)="toggleFavorite(pokemon.id, $event)"
              [attr.aria-label]="isFavorite(pokemon.id) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
            >
              <ion-icon [name]="isFavorite(pokemon.id) ? 'star' : 'star-outline'"></ion-icon>
            </button>
            <img [src]="pokemon.imageUrl" [alt]="pokemon.name" loading="lazy" />
            <ion-card-content>
              <span class="pokemon-name">{{ pokemon.name }}</span>
            </ion-card-content>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  @if (isSearching() && displayedPokemons().length === 0) {
    <p class="empty-state">Nenhum Pokémon encontrado.</p>
  }

  @if (!isSearching()) {
    <ion-infinite-scroll (ionInfinite)="loadMore($event)">
      <ion-infinite-scroll-content></ion-infinite-scroll-content>
    </ion-infinite-scroll>
  }
</ion-content>
